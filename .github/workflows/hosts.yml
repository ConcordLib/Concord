name: hosts

on:
  workflow_call:
    inputs:
      host:
        description: Which host to build and test, one of rimworld, bepinex, elin.
        required: true
        type: string
      elin-image:
        description: Full ref of the ghcr.io/concordlib/elin-game image, required for the bepinex and elin hosts.
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  rimworld:
    name: rimworld ${{ matrix.version }}
    if: inputs.host == 'rimworld'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        version: ['1.1', '1.2', '1.3', '1.4', '1.5', '1.6', '1.7']
    env:
      GAME_VERSION: ${{ matrix.version }}
      GAME_IMAGE: ghcr.io/concordlib/rimworld-game:${{ matrix.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Install gamecrate
        run: npm install -g @gamecrate/cli @gamecrate/rimworld

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'

      - name: Install mono
        if: matrix.version != '1.7'
        run: sudo apt-get update && sudo apt-get install -y mono-devel

      - name: Log in to ghcr.io
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$REGISTRY_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Pull game image
        run: |
          set -euo pipefail
          if ! docker pull "$GAME_IMAGE"; then
            echo "::error::no image at $GAME_IMAGE. ghcr.io/concordlib/rimworld-game has published no tag for RimWorld $GAME_VERSION." >&2
            exit 1
          fi

      - name: Extract game refs
        id: extract
        env:
          XDG_CONFIG_HOME: ${{ github.workspace }}/.github
        run: |
          set -euo pipefail
          profile="v${GAME_VERSION/./}"
          dir=$(gamecrate refs "$profile" --game rimworld --image "$GAME_IMAGE")
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
          echo "staged $(find "$dir" -maxdepth 1 -type f | wc -l) files at $dir"

      - name: Build
        run: dotnet build src/hosts/rimworld/Concord.RimWorld.slnx -c Release -p:GameVersion="$GAME_VERSION" -p:GamecrateRefs="${{ steps.extract.outputs.dir }}" -p:ForkRuntimeDir="${{ steps.extract.outputs.dir }}"

      - name: Test (net10.0)
        if: matrix.version == '1.7'
        run: dotnet test src/hosts/rimworld/Source/ConcordRimWorld.Tests -c Release --no-build

      - name: Test (net472, mono)
        if: matrix.version != '1.7'
        run: CONFIG=Release ./tests/run-net472.sh RimWorld

      - name: Injection surface test
        run: CONCORD_GAME_IMAGE="$GAME_IMAGE" src/hosts/rimworld/test/ingame/run-injection-surface-test.sh "$GAME_VERSION"

      - name: Upload mod artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rimworld-${{ matrix.version }}
          path: src/hosts/rimworld/${{ matrix.version }}/

  bepinex-elin:
    name: ${{ inputs.host }}
    if: inputs.host == 'bepinex' || inputs.host == 'elin'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    env:
      ELIN_IMAGE: ${{ inputs.elin-image }}
      CRANE_VERSION: v0.20.6
      CRANE_SHA256: c1d593d01551f2c9a3df5ca0a0be4385a839bd9b86d4a76e18d7b17d16559127
    steps:
      - name: Require elin image
        run: |
          set -euo pipefail
          if [ -z "$ELIN_IMAGE" ]; then
            echo "::error::elin-image is empty. Pass the ref of the ghcr.io/concordlib/elin-game image." >&2
            exit 1
          fi

      - name: Install crane
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/crane.tar.gz"
          curl -fsSL -o "$archive" "https://github.com/google/go-containerregistry/releases/download/${CRANE_VERSION}/go-containerregistry_Linux_x86_64.tar.gz"
          echo "$CRANE_SHA256  $archive" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/crane-bin"
          tar -xz -C "$RUNNER_TEMP/crane-bin" -f "$archive" crane
          echo "$RUNNER_TEMP/crane-bin" >> "$GITHUB_PATH"

      - name: Log in to ghcr.io
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
        run: echo "$REGISTRY_TOKEN" | crane auth login ghcr.io -u "$REGISTRY_USER" --password-stdin

      - name: Export Elin refs
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/elin-image"
          mkdir -p "$root"
          crane export "$ELIN_IMAGE" - | tar -x -C "$root"
          dir="$root/game"
          for sub in Elin_Data/Managed BepInEx/core; do
            count=$(find "$dir/$sub" -maxdepth 1 -name '*.dll' 2>/dev/null | wc -l)
            if [ "$count" -eq 0 ]; then
              echo "::error::$ELIN_IMAGE holds no dlls under game/$sub." >&2
              exit 1
            fi
            echo "found $count dlls under game/$sub"
          done
          echo "ELIN_DIR=$dir" >> "$GITHUB_ENV"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'

      - name: Install mono
        run: sudo apt-get update && sudo apt-get install -y mono-devel

      - name: Build
        run: |
          set -euo pipefail
          case "${{ inputs.host }}" in
            bepinex) dotnet build src/hosts/bepinex/Concord.BepInEx.slnx -c Release -p:ElinDir="$ELIN_DIR" ;;
            elin)    dotnet build src/hosts/elin/Concord.Elin.slnx -c Release -p:ElinDir="$ELIN_DIR" ;;
          esac

      - name: Test (net472, mono)
        run: |
          set -euo pipefail
          case "${{ inputs.host }}" in
            bepinex) CONFIG=Release ./tests/run-net472.sh BepInEx ;;
            elin)    CONFIG=Release ./tests/run-net472.sh Elin ;;
          esac

      - name: Stage elin mod
        if: inputs.host == 'elin'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/stage/Concord"
          rsync -a --exclude-from=src/hosts/elin/.steamignore src/hosts/elin/ "$RUNNER_TEMP/stage/Concord/"

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ inputs.host }}
          path: ${{ inputs.host == 'bepinex' && 'src/hosts/bepinex/plugin/' || format('{0}/stage/Concord', runner.temp) }}
