name: Deploy Docs

on:
  push:
    branches:
      - main
      - 'v[0-9]+.[0-9]+'
    paths:
      - 'docs/**'
      - 'src/core/**'
      - 'src/backends/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to deploy (unstable, or vX.Y). Leave empty to derive from branch.'
        required: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  lint-prose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout docs
        uses: actions/checkout@v4

      - name: Install Vale
        uses: errata-ai/vale-action@85f9f7f2c5f449ac0ae5b66662961bae3f77ca6a # reviewdog
        with:
          version: 3.15.1
          files: docs/docs
          vale_flags: --config=docs/.vale.ini
          fail_on_error: true
          reporter: github-check

  # TODO(worker has no tests): drop the coverage exclusion and report real coverage
  sonar:
    name: SonarCloud
    if: vars.DOCS_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout docs
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          projectBaseDir: docs
          args: >
            -Dsonar.projectKey=ConcordLib_Docs
            -Dsonar.organization=concordlib
            -Dsonar.host.url=https://sonarcloud.io
            -Dsonar.sources=worker,styles,templates
            -Dsonar.exclusions=**/node_modules/**,api/**,apidoc/**,.site/**
            -Dsonar.coverage.exclusions=**
            -Dsonar.qualitygate.wait=true

  build-and-deploy:
    needs: lint-prose
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - name: Checkout docs
        uses: actions/checkout@v4

      - name: Detect Worker changes
        id: worker_changes
        env:
          BEFORE_SHA: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ] || [ -z "$BEFORE_SHA" ] || [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
            CHANGED=true
          elif git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null || git fetch --no-tags --depth=1 origin "$BEFORE_SHA"; then
            if git diff --quiet "$BEFORE_SHA" "$GITHUB_SHA" -- \
              worker/src \
              worker/wrangler.jsonc \
              worker/package.json \
              worker/package-lock.json \
              worker/tsconfig.json; then
              CHANGED=false
            else
              CHANGED=true
            fi
          else
            echo "::warning::Could not load the previous commit; deploying the Worker to be safe."
            CHANGED=true
          fi

          echo "changed=$CHANGED" >> "$GITHUB_OUTPUT"
          echo "Worker files changed: $CHANGED"

      - name: Determine version
        id: version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          BRANCH="${GITHUB_REF#refs/heads/}"
          if [ "$BRANCH" = "main" ]; then
            DERIVED="unstable"
          else
            DERIVED="$BRANCH"
          fi

          VERSION="${INPUT_VERSION:-$DERIVED}"

          if ! printf '%s' "$VERSION" | grep -qE '^(unstable|v[0-9]+\.[0-9]+)$'; then
            echo "::error::Refusing to deploy: version '$VERSION' is not 'unstable' or vX.Y."
            exit 1
          fi

          if [ "$VERSION" != "$DERIVED" ]; then
            echo "::error::Refusing to deploy: version '$VERSION' does not match branch '$BRANCH', which deploys as '$DERIVED'. Run the deploy from the branch you want to publish."
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Deploying as: $VERSION"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install DocFX
        run: dotnet tool install -g docfx

      - name: Resolve API metadata cache key
        id: metadata_cache_key
        env:
          SOURCE_HASH: ${{ hashFiles('src/core/**', 'src/backends/**', 'docs/docfx.json') }}
        run: |
          DOCFX_VERSION=$(docfx --version)
          echo "key=docfx-api-${RUNNER_OS}-${SOURCE_HASH}-${DOCFX_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Restore API metadata cache
        id: api_metadata_cache
        uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          path: docs/api
          key: ${{ steps.metadata_cache_key.outputs.key }}

      - name: Build the merged runtime
        if: steps.api_metadata_cache.outputs.cache-hit != 'true'
        run: dotnet build ../src/core/Concord/Concord.csproj -c Release

      - name: Build API metadata
        id: api_metadata
        if: steps.api_metadata_cache.outputs.cache-hit != 'true'
        run: docfx metadata docfx.json

      - name: Save API metadata cache
        if: steps.api_metadata_cache.outputs.cache-hit != 'true' && steps.api_metadata.outcome == 'success'
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: docs/api
          key: ${{ steps.metadata_cache_key.outputs.key }}

      - name: Build docs
        run: docfx build docfx.json

      - name: Compute latest version branch
        id: latest
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if ! git ls-remote --heads origin >/dev/null; then
            echo "::error::Cannot list branches on origin. latest-version.py treats an unreachable origin as 'no version branches', which would publish this build over latest/."
            exit 1
          fi

          LATEST=$(python3 worker/scripts/latest-version.py)
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"
          echo "Highest version branch: ${LATEST:-<none>}"

      - name: Install rclone
        if: vars.DOCS_DEPLOY_ENABLED == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes rclone

      - name: Install Worker dependencies
        if: vars.DOCS_DEPLOY_ENABLED == 'true' && steps.worker_changes.outputs.changed == 'true'
        working-directory: docs/worker
        run: npm ci --ignore-scripts

      - name: Refuse to publish a broken build
        env:
          MIN_API_PAGES: '20'
          MIN_DOC_PAGES: '10'
        run: |
          BROKEN=0

          if [ ! -f .site/index.html ]; then
            echo "::error::.site/index.html is missing; docfx produced no site."
            BROKEN=1
          fi

          API_PAGES=$(find .site/api -type f -name '*.html' 2>/dev/null | wc -l) || API_PAGES=0
          if [ "$API_PAGES" -lt "$MIN_API_PAGES" ]; then
            echo "::error::.site/api has $API_PAGES pages, below the floor of $MIN_API_PAGES. Publishing would delete the API reference for this version."
            BROKEN=1
          fi

          DOC_PAGES=$(find .site/docs -type f -name '*.html' 2>/dev/null | wc -l) || DOC_PAGES=0
          if [ "$DOC_PAGES" -lt "$MIN_DOC_PAGES" ]; then
            echo "::error::.site/docs has $DOC_PAGES pages, below the floor of $MIN_DOC_PAGES. Publishing would delete the guides for this version."
            BROKEN=1
          fi

          if [ "$BROKEN" -ne 0 ]; then
            echo "::error::Refusing to sync .site to R2. The bucket has no versioning, so the sync is not reversible."
            exit 1
          fi

          echo "Build passes the floor: $API_PAGES API pages, $DOC_PAGES doc pages."

      - name: Upload docs to R2
        if: vars.DOCS_DEPLOY_ENABLED == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          LATEST: ${{ steps.latest.outputs.latest }}
          RCLONE_CONFIG_R2_TYPE: s3
          RCLONE_CONFIG_R2_PROVIDER: Cloudflare
          RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_R2_ENDPOINT: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
          RCLONE_CONFIG_R2_REGION: auto
        run: |
          RCLONE_FLAGS=(
            --checksum
            --fast-list
            --transfers 16
            --checkers 16
            --delete-after
            --s3-no-check-bucket
            --stats 30s
            --stats-one-line
          )

          rclone sync .site "r2:concord-docs/$VERSION" "${RCLONE_FLAGS[@]}"

          if [ -n "$LATEST" ] && [ "$VERSION" = "$LATEST" ]; then
            rclone sync .site "r2:concord-docs/latest" "${RCLONE_FLAGS[@]}"
          fi

      - name: Update version manifest
        if: vars.DOCS_DEPLOY_ENABLED == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          LATEST: ${{ steps.latest.outputs.latest }}
          RCLONE_CONFIG_R2_TYPE: s3
          RCLONE_CONFIG_R2_PROVIDER: Cloudflare
          RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_R2_ENDPOINT: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
          RCLONE_CONFIG_R2_REGION: auto
        run: |
          python3 worker/scripts/build-versions.py --output "$RUNNER_TEMP/versions.json"

          rclone copyto "$RUNNER_TEMP/versions.json" "r2:concord-docs/versions.json" \
            --checksum \
            --s3-no-check-bucket

      - name: Deploy Worker
        if: vars.DOCS_DEPLOY_ENABLED == 'true' && steps.worker_changes.outputs.changed == 'true'
        working-directory: docs/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --no-install wrangler deploy
