name: CI & Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      runtime_version:
        description: Released Core tag to resend to a runtime repository (for example, v0.7.1)
        required: false
        type: string
      runtime_repository:
        description: Runtime repository to rebuild
        required: false
        default: RimWorld
        type: string
      runtime_release_type:
        description: Release the runtime cuts for that Core tag
        required: false
        default: patch
        type: choice
        options: [patch, minor, major]

permissions:
  contents: read

jobs:
  images:
    name: Game image
    if: github.event_name != 'workflow_dispatch' || inputs.runtime_version == ''
    uses: RimWorks/mod-ci/.github/workflows/game-image.yml@v5
    permissions:
      contents: read
      packages: write
    with:
      artifact-prefix: core-image-ref
      image: ghcr.io/concordlib/rimworld-game
      branches: |
        1.7=unstable
    secrets:
      STEAM_USERNAME: ${{ vars.STEAM_USERNAME }}
      STEAM_CONFIG_VDF_B64: ${{ secrets.STEAM_CONFIG_VDF_B64 }}
      DEPOTDOWNLOADER_ACCOUNT_B64: ${{ secrets.DEPOTDOWNLOADER_ACCOUNT_B64 }}

  refs:
    name: Fork refs
    needs: images
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    env:
      GAME_IMAGE: ${{ fromJSON(needs.images.outputs.image-refs)['1.7'] }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Install gamecrate
        run: npm install -g @gamecrate/cli @gamecrate/rimworld

      - name: Log in to ghcr.io
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$REGISTRY_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Pull game image
        run: docker pull "$GAME_IMAGE"

      - name: Extract fork refs
        id: extract
        env:
          XDG_CONFIG_HOME: ${{ github.workspace }}/.github
        run: |
          set -euo pipefail
          dir=$(gamecrate refs v17 --game rimworld --image "$GAME_IMAGE")
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
          echo "staged $(find "$dir" -maxdepth 1 -type f | wc -l) files at $dir"

      - name: Upload fork refs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fork-refs
          path: ${{ steps.extract.outputs.dir }}

  fork-facts:
    name: Fork facts
    needs: refs
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'

      - name: Download fork refs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: fork-refs
          path: ${{ runner.temp }}/fork-refs

      - name: Require the native fork runtime
        run: |
          set -euo pipefail
          if [ ! -f "$RUNNER_TEMP/fork-refs/libcoreclr.so" ]; then
            echo "::error::fork-refs/libcoreclr.so is missing, so the fork facts have no native runtime to overlay. The refs job needs a gamecrate release whose refs command copies the fork's .so files." >&2
            exit 1
          fi

      - name: Run fork facts
        env:
          FORK_RUNTIME_DIR: ${{ runner.temp }}/fork-refs
        run: |
          set -o pipefail
          tests/Concord.Host.Adapter.ForkTests/run-fork-tests.sh -p:ForkRuntimeDir="$RUNNER_TEMP/fork-refs" -- --report-trx --report-trx-filename fork-facts.trx --results-directory "$RUNNER_TEMP" 2>&1 | tee "$RUNNER_TEMP/fork-facts.log"

      - name: Upload fork facts log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fork-facts-log
          path: |
            ${{ runner.temp }}/fork-facts.log
            ${{ runner.temp }}/fork-facts.trx

  sonar:
    name: SonarCloud
    needs: refs
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch' || inputs.runtime_version == ''
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache NuGet
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Build.props', 'global.json') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Cache SonarCloud packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Install scanner
        run: dotnet tool install --global dotnet-sonarscanner --version 11.3.0

      - name: Download fork refs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: fork-refs
          path: ${{ runner.temp }}/fork-refs

      - name: Analyse
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORK_REFS: ${{ runner.temp }}/fork-refs
        run: |
          set -euo pipefail
          dotnet sonarscanner begin \
            /k:"ConcordLib_Core" \
            /o:"concordlib" \
            /d:sonar.token="$SONAR_TOKEN" \
            /d:sonar.host.url="https://sonarcloud.io" \
            /d:sonar.scanner.scanAll=false \
            /d:sonar.cs.opencover.reportsPaths="coverage/**/coverage.opencover.xml" \
            /d:sonar.coverage.exclusions="tests/**,bench/**" \
            /d:sonar.qualitygate.wait=true
          dotnet build Concord.ci.slnx -c Release -p:ForkRuntimeDir="$FORK_REFS"
          dotnet test Concord.ci.slnx -c Release --no-build -f net10.0 \
            -p:ForkRuntimeDir="$FORK_REFS" \
            --collect:"XPlat Code Coverage;Format=opencover" \
            --results-directory coverage
          dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"

  test:
    name: Test · ${{ matrix.label }}
    needs: refs
    if: github.event_name != 'workflow_dispatch' || inputs.runtime_version == ''
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: linux-x64,    runner: ubuntu-24.04,   experimental: false, testFilter: '' }
          - { label: windows-x64,  runner: windows-latest, experimental: false, testFilter: '' }
          - { label: macos-arm64,  runner: macos-latest,   experimental: false, testFilter: '' }
          # TODO(arm64): flip experimental to false once this cell is green
          - { label: linux-arm64,  runner: ubuntu-24.04-arm, experimental: true,  testFilter: '' }
          - { label: windows-arm64,runner: windows-11-arm,   experimental: false, testFilter: '' }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Build.props', 'global.json') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Download fork refs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: fork-refs
          path: ${{ runner.temp }}/fork-refs

      - name: Restore
        run: dotnet restore Concord.ci.slnx -p:ForkRuntimeDir="${{ runner.temp }}/fork-refs"

      - name: Test
        run: dotnet test Concord.ci.slnx -c Release --no-restore -f net10.0 -p:ForkRuntimeDir="${{ runner.temp }}/fork-refs" --logger trx --results-directory test-results ${{ matrix.testFilter != '' && format('--filter "{0}"', matrix.testFilter) || '' }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-results-${{ matrix.label }}
          path: test-results/**/*.trx

  release:
    name: Release & Publish
    needs: [test, sonar, refs]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      RUNTIME_DISPATCH_REPOS: ${{ secrets.RUNTIME_DISPATCH_REPOS }}
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Build.props', 'global.json') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Download fork refs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: fork-refs
          path: ${{ runner.temp }}/fork-refs

      - name: Build
        run: dotnet build Concord.ci.slnx -c Release -p:ForkRuntimeDir="$RUNNER_TEMP/fork-refs"

      - name: Smoke pack
        run: |
          set -euo pipefail
          dotnet pack src/Concord.Ref/Concord.Ref.csproj -c Release -o "$RUNNER_TEMP/pack-smoke" -p:ForkRuntimeDir="$RUNNER_TEMP/fork-refs"
          dotnet pack src/Concord.Analyzers/Concord.Analyzers.csproj -c Release -o "$RUNNER_TEMP/pack-smoke" -p:ForkRuntimeDir="$RUNNER_TEMP/fork-refs"
          dotnet pack src/Concord.Generators/Concord.Generators.csproj -c Release -o "$RUNNER_TEMP/pack-smoke" -p:ForkRuntimeDir="$RUNNER_TEMP/fork-refs"
          dotnet pack src/Concord/Concord.csproj -c Release -o "$RUNNER_TEMP/pack-smoke" -p:ForkRuntimeDir="$RUNNER_TEMP/fork-refs"
          dotnet pack src/Concord.Host.Adapter/Concord.Host.Adapter.csproj -c Release -o "$RUNNER_TEMP/pack-smoke" -p:ForkRuntimeDir="$RUNNER_TEMP/fork-refs"

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Snapshot tags on HEAD
        env:
          LC_ALL: C
        run: git tag --points-at HEAD | sort > "$RUNNER_TEMP/tags-before"

      - name: Semantic release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx -y -p semantic-release@24.2.9 -p conventional-changelog-conventionalcommits@9.3.1 semantic-release

      - name: Detect release tag
        id: tag
        env:
          LC_ALL: C
        run: |
          set -euo pipefail
          git tag --points-at HEAD | sort > "$RUNNER_TEMP/tags-after"
          TAG=$(grep '^v' "$RUNNER_TEMP/tags-after" | sort -V | tail -1 || true)
          RELEASED=$(comm -13 "$RUNNER_TEMP/tags-before" "$RUNNER_TEMP/tags-after" | grep '^v' | sort -V | tail -1 || true)
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "released=$RELEASED" >> "$GITHUB_OUTPUT"
          echo "newest v-tag on HEAD: ${TAG:-none}"
          echo "cut by this run: ${RELEASED:-none}"
          TYPE=""
          if [ -n "$RELEASED" ]; then
            PREVIOUS=$(git tag --list 'v*' --sort=-v:refname | grep -vx "$RELEASED" | head -1 || true)
            IFS=. read -r NEW_MAJOR NEW_MINOR _ <<< "${RELEASED#v}"
            IFS=. read -r OLD_MAJOR OLD_MINOR _ <<< "${PREVIOUS#v}"
            if [ -z "$PREVIOUS" ] || [ "$NEW_MAJOR" != "$OLD_MAJOR" ]; then
              TYPE="major"
            elif [ "$NEW_MINOR" != "$OLD_MINOR" ]; then
              TYPE="minor"
            else
              TYPE="patch"
            fi
          fi
          echo "type=$TYPE" >> "$GITHUB_OUTPUT"
          echo "release type against ${PREVIOUS:-no earlier tag}: ${TYPE:-none}"

      - name: Pack
        if: steps.tag.outputs.tag != ''
        run: |
          dotnet pack src/Concord.Ref/Concord.Ref.csproj -c Release -o artifacts -p:ForkRuntimeDir="$RUNNER_TEMP/fork-refs"
          dotnet pack src/Concord.Analyzers/Concord.Analyzers.csproj -c Release -o artifacts -p:ForkRuntimeDir="$RUNNER_TEMP/fork-refs"
          dotnet pack src/Concord.Generators/Concord.Generators.csproj -c Release -o artifacts -p:ForkRuntimeDir="$RUNNER_TEMP/fork-refs"
          dotnet pack src/Concord/Concord.csproj -c Release -o artifacts -p:ForkRuntimeDir="$RUNNER_TEMP/fork-refs"
          dotnet pack src/Concord.Host.Adapter/Concord.Host.Adapter.csproj -c Release -o artifacts -p:ForkRuntimeDir="$RUNNER_TEMP/fork-refs"

      - name: NuGet login
        if: steps.tag.outputs.tag != ''
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Publish to nuget.org
        if: steps.tag.outputs.tag != ''
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      - name: Announce on Discord
        if: steps.tag.outputs.released != ''
        continue-on-error: true
        env:
          WEBHOOK: ${{ secrets.NEO_MODS_DISCORD_WEBHOOK_URL }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          NOTES=$(gh release view "${{ steps.tag.outputs.released }}" --json body -q .body | head -c 1600)
          URL=$(gh release view "${{ steps.tag.outputs.released }}" --json url -q .url)
          CONTENT=$(printf '**Concord %s** — now on NuGet\n\n%s\n\n%s' "${{ steps.tag.outputs.released }}" "$NOTES" "$URL")
          STATUS=$(curl -sS -o response.txt -w '%{http_code}' -X POST "${WEBHOOK}?thread_id=1522736349583638711&wait=true" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg c "$CONTENT" '{content:$c, allowed_mentions:{parse:[]}}')")
          echo "Discord HTTP $STATUS"
          cat response.txt
          if [ "$STATUS" -ge 400 ]; then
            echo "::warning::Discord announce failed with HTTP $STATUS (release itself is unaffected)"
          fi

      - name: Mask runtime repository names
        if: steps.tag.outputs.tag != '' && env.RUNTIME_DISPATCH_REPOS != ''
        run: |
          set -euo pipefail
          IFS=',' read -ra repos <<< "$RUNTIME_DISPATCH_REPOS"
          for repo in "${repos[@]}"; do
            echo "::add-mask::$(echo "$repo" | xargs)"
          done

      - name: Generate runtime dispatch token
        if: steps.tag.outputs.released != '' && env.RUNTIME_DISPATCH_REPOS != ''
        id: apptoken
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1
        with:
          app-id: ${{ vars.RUNTIME_DISPATCH_APP_ID }}
          private-key: ${{ secrets.RUNTIME_DISPATCH_APP_PRIVATE_KEY }}
          owner: ConcordLib
          repositories: ${{ env.RUNTIME_DISPATCH_REPOS }}

      - name: Trigger runtime rebuilds
        if: steps.tag.outputs.released != '' && env.RUNTIME_DISPATCH_REPOS != ''
        env:
          GH_TOKEN: ${{ steps.apptoken.outputs.token }}
        run: |
          set -euo pipefail
          IFS=',' read -ra repos <<< "$RUNTIME_DISPATCH_REPOS"
          for repo in "${repos[@]}"; do
            repo=$(echo "$repo" | xargs)
            gh api "repos/ConcordLib/$repo/dispatches" \
              -f event_type=core-released \
              -F "client_payload[core_version]=${{ steps.tag.outputs.released }}" \
              -F "client_payload[release_type]=${{ steps.tag.outputs.type }}"
          done

  dispatch-runtime:
    name: Dispatch runtime rebuild
    if: github.event_name == 'workflow_dispatch' && inputs.runtime_version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Mask runtime repository name
        env:
          RUNTIME_REPOSITORY: ${{ inputs.runtime_repository }}
        run: echo "::add-mask::${RUNTIME_REPOSITORY}"

      - name: Generate runtime-repository token
        id: apptoken
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1
        with:
          app-id: ${{ vars.RUNTIME_DISPATCH_APP_ID }}
          private-key: ${{ secrets.RUNTIME_DISPATCH_APP_PRIVATE_KEY }}
          owner: ConcordLib
          repositories: ${{ inputs.runtime_repository }}

      - name: Trigger runtime rebuild
        env:
          GH_TOKEN: ${{ steps.apptoken.outputs.token }}
          RUNTIME_REPOSITORY: ${{ inputs.runtime_repository }}
          RUNTIME_VERSION: ${{ inputs.runtime_version }}
          RUNTIME_RELEASE_TYPE: ${{ inputs.runtime_release_type }}
        run: |
          set -euo pipefail
          gh api "repos/ConcordLib/${RUNTIME_REPOSITORY}/dispatches" \
            -f event_type=core-released \
            -F "client_payload[core_version]=${RUNTIME_VERSION}" \
            -F "client_payload[release_type]=${RUNTIME_RELEASE_TYPE}"
