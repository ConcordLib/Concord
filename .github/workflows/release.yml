name: release

on:
  workflow_call:
    inputs:
      shippable:
        description: Which shippable to release — core, rimworld, bepinex or elin.
        required: true
        type: string
      elin-image:
        description: Full ref of the Elin game image, read by the bepinex and elin releases.
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  core:
    name: Release · core
    if: inputs.shippable == 'core' && vars.RELEASES_ENABLED == 'true'
    runs-on: ubuntu-latest
    env:
      RUNTIME_DISPATCH_REPOS: ${{ secrets.RUNTIME_DISPATCH_REPOS }}
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Build.props', 'global.json') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Download fork refs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: fork-refs
          path: ${{ runner.temp }}/fork-refs

      - name: Build
        run: dotnet build Concord.ci.slnx -c Release -p:ForkRuntimeDir="$RUNNER_TEMP/fork-refs"

      - name: Smoke pack
        run: |
          set -euo pipefail
          for project in \
            src/core/Concord.Ref/Concord.Ref.csproj \
            src/core/Concord.Analyzers/Concord.Analyzers.csproj \
            src/core/Concord.Generators/Concord.Generators.csproj \
            src/core/Concord/Concord.csproj \
            src/backends/Concord.Waylith/Concord.Waylith.csproj \
            src/backends/Concord.MonoMod/Concord.MonoMod.csproj \
            src/backends/Concord.HarmonyX/Concord.HarmonyX.csproj; do
            dotnet pack "$project" -c Release -o "$RUNNER_TEMP/pack-smoke" -p:ForkRuntimeDir="$RUNNER_TEMP/fork-refs"
          done

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Install release dependencies
        run: npm install --no-audit --no-fund --ignore-scripts

      - name: Require a seeded core tag
        run: |
          set -euo pipefail
          if [ -z "$(git tag --list 'core-v*')" ]; then
            echo "::error::no core-v* tag exists. Seed one on this merge-base before enabling releases, e.g. git tag core-v0.31.0 <sha> && git push origin core-v0.31.0." >&2
            exit 1
          fi

      - name: Snapshot tags on HEAD
        env:
          LC_ALL: C
        run: git tag --points-at HEAD | sort > "$RUNNER_TEMP/tags-before"

      - name: Semantic release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./node_modules/.bin/semantic-release

      - name: Detect release tag
        id: tag
        env:
          LC_ALL: C
        run: |
          set -euo pipefail
          git tag --points-at HEAD | sort > "$RUNNER_TEMP/tags-after"
          TAG=$(grep '^core-v' "$RUNNER_TEMP/tags-after" | sort -V | tail -1 || true)
          RELEASED=$(comm -13 "$RUNNER_TEMP/tags-before" "$RUNNER_TEMP/tags-after" | grep '^core-v' | sort -V | tail -1 || true)
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "released=$RELEASED" >> "$GITHUB_OUTPUT"
          echo "newest core tag on HEAD: ${TAG:-none}"
          echo "cut by this run: ${RELEASED:-none}"
          TYPE=""
          if [ -n "$RELEASED" ]; then
            PREVIOUS=$(git tag --list 'core-v*' --sort=-v:refname | grep -vx "$RELEASED" | head -1 || true)
            IFS=. read -r NEW_MAJOR NEW_MINOR _ <<< "${RELEASED#core-v}"
            IFS=. read -r OLD_MAJOR OLD_MINOR _ <<< "${PREVIOUS#core-v}"
            if [ -z "$PREVIOUS" ] || [ "$NEW_MAJOR" != "$OLD_MAJOR" ]; then
              TYPE="major"
            elif [ "$NEW_MINOR" != "$OLD_MINOR" ]; then
              TYPE="minor"
            else
              TYPE="patch"
            fi
          fi
          echo "type=$TYPE" >> "$GITHUB_OUTPUT"
          echo "release type against ${PREVIOUS:-no earlier tag}: ${TYPE:-none}"

      - name: Pack
        if: steps.tag.outputs.tag != ''
        run: |
          set -euo pipefail
          for project in \
            src/core/Concord.Ref/Concord.Ref.csproj \
            src/core/Concord.Analyzers/Concord.Analyzers.csproj \
            src/core/Concord.Generators/Concord.Generators.csproj \
            src/core/Concord/Concord.csproj \
            src/backends/Concord.Waylith/Concord.Waylith.csproj \
            src/backends/Concord.MonoMod/Concord.MonoMod.csproj \
            src/backends/Concord.HarmonyX/Concord.HarmonyX.csproj; do
            dotnet pack "$project" -c Release -o artifacts -p:ForkRuntimeDir="$RUNNER_TEMP/fork-refs"
          done

      - name: NuGet login
        if: steps.tag.outputs.tag != ''
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Publish to nuget.org
        if: steps.tag.outputs.tag != ''
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      - name: Announce on Discord
        if: steps.tag.outputs.released != ''
        continue-on-error: true
        env:
          WEBHOOK: ${{ secrets.NEO_MODS_DISCORD_WEBHOOK_URL }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          NOTES=$(gh release view "${{ steps.tag.outputs.released }}" --json body -q .body | head -c 1600)
          URL=$(gh release view "${{ steps.tag.outputs.released }}" --json url -q .url)
          CONTENT=$(printf '**Concord %s** — now on NuGet\n\n%s\n\n%s' "${{ steps.tag.outputs.released }}" "$NOTES" "$URL")
          STATUS=$(curl -sS -o response.txt -w '%{http_code}' -X POST "${WEBHOOK}?thread_id=1522736349583638711&wait=true" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg c "$CONTENT" '{content:$c, allowed_mentions:{parse:[]}}')")
          echo "Discord HTTP $STATUS"
          cat response.txt
          if [ "$STATUS" -ge 400 ]; then
            echo "::warning::Discord announce failed with HTTP $STATUS (release itself is unaffected)"
          fi

      - name: Mask runtime repository names
        if: steps.tag.outputs.tag != '' && env.RUNTIME_DISPATCH_REPOS != ''
        run: |
          set -euo pipefail
          IFS=',' read -ra repos <<< "$RUNTIME_DISPATCH_REPOS"
          for repo in "${repos[@]}"; do
            echo "::add-mask::$(echo "$repo" | xargs)"
          done

      - name: Generate runtime dispatch token
        if: steps.tag.outputs.released != '' && env.RUNTIME_DISPATCH_REPOS != ''
        id: apptoken
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1
        with:
          app-id: ${{ vars.RUNTIME_DISPATCH_APP_ID }}
          private-key: ${{ secrets.RUNTIME_DISPATCH_APP_PRIVATE_KEY }}
          owner: ConcordLib
          repositories: ${{ env.RUNTIME_DISPATCH_REPOS }}

      - name: Trigger runtime rebuilds
        if: steps.tag.outputs.released != '' && env.RUNTIME_DISPATCH_REPOS != ''
        env:
          GH_TOKEN: ${{ steps.apptoken.outputs.token }}
        run: |
          set -euo pipefail
          IFS=',' read -ra repos <<< "$RUNTIME_DISPATCH_REPOS"
          for repo in "${repos[@]}"; do
            repo=$(echo "$repo" | xargs)
            gh api "repos/ConcordLib/$repo/dispatches" \
              -f event_type=core-released \
              -F "client_payload[core_version]=${{ steps.tag.outputs.released }}" \
              -F "client_payload[release_type]=${{ steps.tag.outputs.type }}"
          done

  rimworld:
    name: Release · rimworld
    if: inputs.shippable == 'rimworld' && vars.RELEASES_ENABLED == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/hosts/rimworld
    permissions:
      contents: write
      issues: write
      pull-requests: write
      packages: read
    outputs:
      published: ${{ steps.after.outputs.published }}
      version: ${{ steps.after.outputs.version }}
      tag: ${{ steps.after.outputs.tag }}
      previous-tag: ${{ steps.before.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Install gamecrate
        run: npm install -g @gamecrate/cli @gamecrate/rimworld

      - name: Install release dependencies
        run: npm install --no-audit --no-fund --ignore-scripts

      - name: Log in to ghcr.io
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$REGISTRY_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Extract game refs
        working-directory: .
        env:
          XDG_CONFIG_HOME: ${{ github.workspace }}/.github
        run: |
          set -euo pipefail
          for version in 1.1 1.2 1.3 1.4 1.5 1.6 1.7; do
            image="ghcr.io/concordlib/rimworld-game:$version"
            if ! docker pull "$image"; then
              echo "::error::no image at $image. ghcr.io/concordlib/rimworld-game has published no tag for RimWorld $version." >&2
              exit 1
            fi
            dir=$(gamecrate refs "v${version/./}" --game rimworld --image "$image")
            echo "GAME_MANAGED_${version/./_}=$dir" >> "$GITHUB_ENV"
            echo "staged RimWorld $version at $dir"
          done

      - name: Require a seeded rimworld tag
        run: |
          set -euo pipefail
          if [ -z "$(git tag --list 'rimworld-v*')" ]; then
            echo "::error::no rimworld-v* tag exists. Seed one on this merge-base before enabling releases, e.g. git tag rimworld-v2.0.0 <sha> && git push origin rimworld-v2.0.0." >&2
            exit 1
          fi

      - name: Record the tag before releasing
        id: before
        run: echo "tag=$(git describe --tags --match 'rimworld-v*' --abbrev=0 2>/dev/null || true)" >> "$GITHUB_OUTPUT"

      - name: Semantic release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SPLIT_PUBLISH: '1'
          FORK_RUNTIME_DIR: ${{ env.GAME_MANAGED_1_7 }}
        run: ./node_modules/.bin/semantic-release

      - name: Read the tag it just cut
        id: after
        run: |
          set -euo pipefail
          tag=$(git describe --tags --match 'rimworld-v*' --abbrev=0 2>/dev/null || true)
          if [ "$tag" = "${{ steps.before.outputs.tag }}" ] || [ -z "$tag" ]; then
            echo "published=false" >> "$GITHUB_OUTPUT"
          else
            {
              echo "published=true"
              echo "tag=$tag"
              echo "version=${tag#rimworld-v}"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Upload the release zips
        if: steps.after.outputs.published == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-zips
          path: src/hosts/rimworld/dist/Concord-*.zip
          if-no-files-found: error

  rimworld-publish:
    name: Publish · rimworld
    needs: rimworld
    if: needs.rimworld.outputs.published == 'true' && vars.RELEASES_ENABLED == 'true'
    uses: RimWorks/mod-ci/.github/workflows/publish.yml@792acaa8df9fe5823e66d34fbd85ff5a9365d7fa # v6
    permissions:
      contents: read
    secrets:
      STEAM_USERNAME: ${{ vars.STEAM_USERNAME }}
      STEAM_PASSWORD: ${{ secrets.STEAM_PASSWORD }}
      STEAM_CONFIG_VDF_B64: ${{ secrets.STEAM_CONFIG_VDF_B64 }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
    with:
      workdir: src/hosts/rimworld
      release-config: release.config.mjs
      version: ${{ needs.rimworld.outputs.version }}
      zip-artifact: release-zips
      discord-mod-name: Concord
      discord-workshop-id: '3758333473'
      discord-embed-color: 9B59B6
      tag: ${{ needs.rimworld.outputs.tag }}
      previous-tag: ${{ needs.rimworld.outputs.previous-tag }}

  bepinex:
    name: Release · bepinex
    if: inputs.shippable == 'bepinex' && vars.RELEASES_ENABLED == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/hosts/bepinex
    permissions:
      contents: write
      issues: write
      pull-requests: write
      packages: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Require an Elin image
        env:
          ELIN_IMAGE: ${{ inputs.elin-image }}
        run: |
          if [ -z "$ELIN_IMAGE" ]; then
            echo "::error::the elin-image input is empty. The caller must pass the Elin game image ref." >&2
            exit 1
          fi

      - name: Fetch Elin refs
        env:
          ELIN_IMAGE: ${{ inputs.elin-image }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          crane_dir="$RUNNER_TEMP/crane"
          mkdir -p "$crane_dir"
          curl -fsSL -o "$crane_dir/crane.tar.gz" https://github.com/google/go-containerregistry/releases/download/v0.22.1/go-containerregistry_Linux_x86_64.tar.gz
          echo "0ab7a1d6932a213aed964ce97666c3077fe691c8606413674a8b3e0b9ec4cda0  $crane_dir/crane.tar.gz" | sha256sum -c -
          tar -xzf "$crane_dir/crane.tar.gz" -C "$crane_dir" crane
          echo "$GITHUB_TOKEN" | "$crane_dir/crane" auth login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          dir="$RUNNER_TEMP/elin-refs"
          mkdir -p "$dir"
          "$crane_dir/crane" export "$ELIN_IMAGE" - | tar -x -C "$dir"
          for sub in Elin_Data/Managed BepInEx/core; do
            if [ ! -d "$dir/game/$sub" ]; then
              echo "::error::$ELIN_IMAGE has no game/$sub folder." >&2
              exit 1
            fi
            count=$(find "$dir/game/$sub" -maxdepth 1 -name '*.dll' | wc -l)
            if [ "$count" -eq 0 ]; then
              echo "::error::$ELIN_IMAGE holds no dlls in game/$sub." >&2
              exit 1
            fi
          done
          echo "ELIN_DIR=$dir/game" >> "$GITHUB_ENV"

      - name: Install mono
        run: sudo apt-get update && sudo apt-get install -y mono-devel

      - name: Install release dependencies
        run: npm install --no-audit --no-fund --ignore-scripts

      - name: Require a seeded bepinex tag
        run: |
          set -euo pipefail
          if [ -z "$(git tag --list 'bepinex-v*')" ]; then
            echo "::error::no bepinex-v* tag exists. Seed one on this merge-base before enabling releases, e.g. git tag bepinex-v1.0.0 <sha> && git push origin bepinex-v1.0.0." >&2
            exit 1
          fi

      - name: Semantic release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./node_modules/.bin/semantic-release

  elin:
    name: Release · elin
    if: inputs.shippable == 'elin' && vars.RELEASES_ENABLED == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/hosts/elin
    permissions:
      contents: write
      issues: write
      pull-requests: write
      packages: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Require an Elin image
        env:
          ELIN_IMAGE: ${{ inputs.elin-image }}
        run: |
          if [ -z "$ELIN_IMAGE" ]; then
            echo "::error::the elin-image input is empty. The caller must pass the Elin game image ref." >&2
            exit 1
          fi

      - name: Fetch Elin refs
        env:
          ELIN_IMAGE: ${{ inputs.elin-image }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          crane_dir="$RUNNER_TEMP/crane"
          mkdir -p "$crane_dir"
          curl -fsSL -o "$crane_dir/crane.tar.gz" https://github.com/google/go-containerregistry/releases/download/v0.22.1/go-containerregistry_Linux_x86_64.tar.gz
          echo "0ab7a1d6932a213aed964ce97666c3077fe691c8606413674a8b3e0b9ec4cda0  $crane_dir/crane.tar.gz" | sha256sum -c -
          tar -xzf "$crane_dir/crane.tar.gz" -C "$crane_dir" crane
          echo "$GITHUB_TOKEN" | "$crane_dir/crane" auth login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          dir="$RUNNER_TEMP/elin-refs"
          mkdir -p "$dir"
          "$crane_dir/crane" export "$ELIN_IMAGE" - | tar -x -C "$dir"
          for sub in Elin_Data/Managed BepInEx/core; do
            if [ ! -d "$dir/game/$sub" ]; then
              echo "::error::$ELIN_IMAGE has no game/$sub folder." >&2
              exit 1
            fi
            count=$(find "$dir/game/$sub" -maxdepth 1 -name '*.dll' | wc -l)
            if [ "$count" -eq 0 ]; then
              echo "::error::$ELIN_IMAGE holds no dlls in game/$sub." >&2
              exit 1
            fi
          done
          echo "ELIN_DIR=$dir/game" >> "$GITHUB_ENV"

      - name: Stamp the game version
        run: |
          set -euo pipefail
          kit_file="$ELIN_DIR/Package/_ModdingKit/package.xml"
          if [ ! -f "$kit_file" ]; then
            echo "::error::$kit_file is missing. The Elin game image must also hold game/Package/_ModdingKit/package.xml." >&2
            exit 1
          fi
          game_version=$(grep -oP '<version>\K[^<]+' "$kit_file")
          sed -i "s|<version>[^<]*</version>|<version>$game_version</version>|" package.xml
          grep '<version>' package.xml

      - name: Install mono
        run: sudo apt-get update && sudo apt-get install -y mono-devel

      - name: Install release dependencies
        run: npm install --no-audit --no-fund --ignore-scripts

      - name: Require a seeded elin tag
        run: |
          set -euo pipefail
          if [ -z "$(git tag --list 'elin-v*')" ]; then
            echo "::error::no elin-v* tag exists. Seed one on this merge-base before enabling releases, e.g. git tag elin-v1.0.0 <sha> && git push origin elin-v1.0.0." >&2
            exit 1
          fi

      - name: Semantic release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./node_modules/.bin/semantic-release
